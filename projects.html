<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#f4f6f9;
}

/* Header */
.top-header{
    text-align:center;
    padding:20px;
    font-size:26px;
    font-weight:bold;
    color:#000;
    background: linear-gradient(to right,#ff9933,#ffffff,#138808);
}
/* Menu */
.menu{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    background:#003f7f;
}
.menu a{
    color:white;
    padding:12px 18px;
    text-decoration:none;
    font-weight:bold;
}
.menu a:hover{
    background:#002a55;
}

/* Container */
.container{
    max-width:1100px;
    margin:auto;
    padding:20px;
}

/* Section box */
.box{
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:25px;
    box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.box h2{
    margin-top:0;
    color:#003f7f;
}

/* Form */
input, textarea, button{
    width:100%;
    padding:10px;
    margin-top:8px;
    margin-bottom:15px;
    font-size:15px;
}

button{
    background:#003f7f;
    color:white;
    border:none;
    cursor:pointer;
    font-weight:bold;
}
button:hover{
    background:#002a55;
}

/* Map */
iframe{
    width:100%;
    height:300px;
    border:0;
}

/* Message */
#msg{
    font-weight:bold;
    margin-top:10px;
}

/* आपत्कालीन संपर्क */
.em-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #e5e5e5;font-size:16px}
.em-row:last-child{border-bottom:none}
.em-row a{color:#003f7f;font-weight:bold;text-decoration:underline}
.success{color:green;}
.error{color:red;}

/* प्रकल्प */
.prj-h{color:#003f7f;margin:26px 0 12px;font-size:22px}
.prj-h:before{content:"◆";color:#e0a020;margin-right:10px;font-size:18px}
.prj-empty{color:#777;font-style:italic;margin:0 0 6px 4px}
.prj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.prj-card{background:#fff;border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,.15);overflow:hidden;border-top:4px solid #003f7f}
.prj-card.pj-done{border-top-color:#2e7d32}.prj-card.pj-run{border-top-color:#ef6c00}.prj-card.pj-plan{border-top-color:#6a1b9a}
.prj-img{width:100%;height:180px;object-fit:cover;display:block;background:#e9edf2}
.prj-noimg{height:180px;display:flex;align-items:center;justify-content:center;font-size:44px;background:#e9edf2}
.prj-body{padding:12px 14px}
.prj-body h3{margin:0 0 8px;color:#003f7f;font-size:17px}
.prj-dt{font-size:13.5px;color:#333;margin:3px 0}
.prj-dt b{color:#555}
.prj-badge{display:inline-block;font-size:12px;font-weight:bold;color:#fff;padding:2px 10px;border-radius:12px;margin-bottom:8px}
.pj-done .prj-badge{background:#2e7d32}.pj-run .prj-badge{background:#ef6c00}.pj-plan .prj-badge{background:#6a1b9a}
</style>
